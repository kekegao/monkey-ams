spring.application.name=user-bsm-biz-service
server.port=8082

# Dubbo
dubbo.application.name=user-bsm-biz-service
dubbo.application.qos-enable=false
dubbo.registry.address=zookeeper://localhost:2181
dubbo.protocol.name=dubbo
dubbo.protocol.port=20882

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/monkey_ams?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 控制台打印SQL
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
